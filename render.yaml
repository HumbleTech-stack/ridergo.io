services:
  - type: web
    name: ridergo
    runtime: node
    plan: starter
    buildCommand: node --version
    startCommand: node --no-warnings server/index.js
    healthCheckPath: /
    disk:
      name: ridergo-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.13.0
      - key: DB_FILE
        value: /var/data/ridergo.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
